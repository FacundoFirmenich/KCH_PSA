[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kch-psa"
version = "0.1.0.dev0"
description = "Vendor-neutral constitutional runtime for KCH Personal Super Assistant"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kch-psa-conformance = "kch_psa.conformance:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
